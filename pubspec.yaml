name: fluentta_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  flutter_svg: ^2.3.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0
  connectivity_plus: ^6.1.4
  flutter_tts: ^4.2.2
  dotted_decoration: ^2.0.0
  intl: any
  dotted_line: ^3.3.0
  speech_to_text: ^7.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/lessons/manifest.json
    - assets/lessons/a1/vocabulary/
    - assets/lessons/a1/grammar/
    - assets/lessons/a1/reading/
    - assets/lessons/a2/vocabulary/
    - assets/lessons/a2/grammar/
    - assets/lessons/a2/reading/
    - assets/lessons/b1/vocabulary/
    - assets/lessons/b1/grammar/
    - assets/lessons/b1/reading/
    - assets/lessons/b2/vocabulary/
    - assets/lessons/b2/grammar/
    - assets/lessons/b2/reading/
    - assets/lessons/c1/vocabulary/
    - assets/lessons/c1/grammar/
    - assets/lessons/c1/reading/
    - assets/lessons/c2/vocabulary/
    - assets/lessons/c2/grammar/
    - assets/lessons/c2/reading/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
